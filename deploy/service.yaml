# Rendered by Skaffold and deployed by Cloud Deploy. Each target sets its own service name.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: lectio # from-param: ${service_name}
spec:
  template:
    metadata:
      annotations:
        # Caps cost, and the in-memory rate limiter is only correct with one instance.
        autoscaling.knative.dev/maxScale: "1"
    spec:
      serviceAccountName: lectio-run@lectio-gero-2026.iam.gserviceaccount.com
      containers:
        - image: api
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api-key
                  key: "1"
